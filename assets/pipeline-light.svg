<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 172" width="830" height="172" role="img" aria-label="공정 도면 심볼 인식: 심볼 검출, 텍스트 짝짓기, 배관 연결, CAD 원본 추출 순서로 처리. 운영 기본 엔진으로 채택, 검출 모델 mAP50 0.986, 재현율 0.988(내부 검증셋)." font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif" style="font-variant-numeric: tabular-nums">
<style>
