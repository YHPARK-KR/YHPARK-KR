<text x="587.2" y="101" font-size="15" font-weight="700" fill="#388BFD">88.2%</text>
<line x1="16" y1="114.5" x2="814" y2="114.5" stroke="#30363D"/>
<text x="16" y="148" font-size="16" font-weight="700" fill="#F0F6FC">개인정보 가림</text>
<text x="16" y="168" font-size="13" fill="#8B949E">같은 22개 사례, 실제 가려진 결과 기준 재현율</text>
<text x="16" y="195" font-size="13" fill="#8B949E">전</text>
