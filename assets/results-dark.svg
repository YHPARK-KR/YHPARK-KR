<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 350" width="830" height="350" role="img" aria-label="같은 조건에서 바꾸기 전과 후. 노트 검색 78.2%에서 88.2%, 개인정보 가림 0.875에서 1.000, 관상네컷 80초에서 40초." font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif" style="font-variant-numeric: tabular-nums">
<rect x="0.5" y="0.5" width="829" height="349" rx="4" fill="#161B22" stroke="#30363D"/>
<text x="16" y="32" font-size="16" font-weight="700" fill="#F0F6FC">노트 검색</text>
<text x="16" y="52" font-size="13" fill="#8B949E">같은 119개 질문, 노트 단위 R@10</text>
<text x="16" y="79" font-size="13" fill="#8B949E">전</text>
<rect x="48" y="68" width="469.2" height="12" rx="2" fill="#6E7681"/>
<text x="527.2" y="79" font-size="15" font-weight="400" fill="#8B949E">78.2%</text>
