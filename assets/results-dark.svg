<rect x="48" y="206" width="600.0" height="12" rx="2" fill="#388BFD"/>
<text x="658.0" y="217" font-size="15" font-weight="700" fill="#388BFD">1.000</text>
<line x1="16" y1="230.5" x2="814" y2="230.5" stroke="#30363D"/>
<text x="16" y="264" font-size="16" font-weight="700" fill="#F0F6FC">관상네컷</text>
<text x="16" y="284" font-size="13" fill="#8B949E">같은 사진 기준 응답 시간, 짧을수록 좋음</text>
<text x="16" y="311" font-size="13" fill="#8B949E">전</text>
<rect x="48" y="300" width="600.0" height="12" rx="2" fill="#6E7681"/>
<text x="658.0" y="311" font-size="15" font-weight="400" fill="#8B949E">80초</text>
